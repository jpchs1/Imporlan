name: Build post-inspection price release
on:
  push:
    branches: [feat/post-inspection-price-confirmation]
    paths:
      - .github/workflows/build-post-inspection-price.yml
permissions:
  contents: write
jobs:
  build-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-react/package-lock.json
      - run: npm ci --prefix admin-react --no-audit --no-fund
      - name: Build current admin production assets
        working-directory: admin-react
        run: BUILD_TARGET=admin npx vite build --manifest
      - name: Save compiled assets to this task branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A panel/admin
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build current admin assets for inspection price confirmation"
          git push origin HEAD:feat/post-inspection-price-confirmation
