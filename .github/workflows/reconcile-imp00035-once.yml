name: Reconcile authorized IMP-00035 bank credit
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [ops/reconcile-imp00035-20261115]
    paths:
      - .github/workflows/reconcile-imp00035-once.yml
      - scripts/reconcile_imp00035_once.py
permissions:
  contents: read
concurrency:
  group: reconcile-imp00035-pago3-20261114
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.ref == 'refs/heads/ops/reconcile-imp00035-20261115' || github.head_ref == 'ops/reconcile-imp00035-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use panel secrets and verify the authorized credit
        env:
          IMPORLAN_ADMIN_EMAIL: ${{ secrets.IMPORLAN_ADMIN_EMAIL }}
          IMPORLAN_ADMIN_PASSWORD: ${{ secrets.IMPORLAN_ADMIN_PASSWORD }}
        run: python3 scripts/reconcile_imp00035_once.py
