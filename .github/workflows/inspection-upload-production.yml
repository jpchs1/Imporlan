name: Verify production release

on:
  push:
    branches: [main]
    paths:
      - api/inspection_upload_*.php
      - api/inspection_price_*.php
      - api/import_action*.php
      - api/email_service.php
      - api/email-assets/**
      - api/payment_receipts*.php
      - api/payment_requests_api.php
      - api/cron/inspection_upload_followup.php
      - api/operador_usa.php
      - cron-deploy.sh
      - .htaccess
      - admin-react/src/**
      - panel/**
      - .github/workflows/inspection-upload-production.yml

permissions:
  contents: read

concurrency:
  group: imporlan-production
  cancel-in-progress: true

jobs:
  verify-hosting:
    name: Confirm the hosting published this commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the existing hosting deploy and verify the CLI job is private
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, time, urllib.request, urllib.error
          expected = os.environ['EXPECTED_SHA']
          deadline = time.monotonic() + 720
          url = 'https://www.imporlan.cl/.imporlan_docroot?release=' + expected
          while time.monotonic() < deadline:
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      sentinel = response.read(4096).decode('utf-8')
                  match = re.search(r'^commit:\s*([a-f0-9]{40})\s*$', sentinel, re.M)
                  if match and match.group(1) == expected:
                      print('Production commit verified:', expected)
                      break
                  print('Waiting for hosting to publish this commit.')
              except (urllib.error.URLError, UnicodeError) as error:
                  print('Deployment check pending:', type(error).__name__)
              time.sleep(30)
          else:
              raise SystemExit('Hosting did not publish the expected commit within 12 minutes.')
          # The deploy copies pre-built files. Verify both live panels load
          # this release's entry points and that each referenced asset matches.
          for panel in ('panel/', 'panel/admin/'):
              html = pathlib.Path(panel + 'index.html').read_text()
              assets = set(re.findall(r'(?:src|href)="(/panel/[^\"]+\.(?:js|css)(?:\?[^\"]*)?)"', html))
              if not assets:
                  raise SystemExit('No compiled assets found for ' + panel)
              # Expedientes loads its own JS/CSS lazily. Verify those files
              # too: matching the entry point alone cannot confirm its design.
              workspace_assets = set()
              for asset in assets:
                  if asset.split('?')[0].endswith('.js'):
                      source = pathlib.Path(asset.split('?')[0].lstrip('/')).read_text()
                      workspace_assets.update('/' + panel + path for path in re.findall(r'"(assets/(?:Orders|Expedientes)-[^"\s]+\.(?:js|css))"', source))
              if not any(path.endswith('.css') for path in workspace_assets):
                  raise SystemExit('No compiled expediente stylesheet found for ' + panel)
              assets.update(workspace_assets)
              with urllib.request.urlopen('https://www.imporlan.cl/' + panel + '?release=' + expected, timeout=30) as response:
                  live = response.read().decode('utf-8')
                  if "worker-src 'self' blob:" not in response.headers.get('Content-Security-Policy', ''):
                      raise SystemExit('HEIC worker policy missing on ' + panel)
              for asset in assets:
                  if asset not in workspace_assets and asset not in live:
                      raise SystemExit('Live HTML references a different release: ' + panel)
                  local = pathlib.Path(asset.split('?')[0].lstrip('/')).read_bytes()
                  with urllib.request.urlopen('https://www.imporlan.cl' + asset, timeout=30) as response:
                      remote = response.read()
                  if hashlib.sha256(local).digest() != hashlib.sha256(remote).digest():
                      raise SystemExit('Production asset mismatch: ' + asset)
              print('Production panel and compiled assets verified:', panel)
              print('Production expediente scripts and styles verified:', panel)
          try:
              urllib.request.urlopen('https://www.imporlan.cl/api/cron/inspection_upload_followup.php', timeout=20)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit('Unexpected HTTP status for the CLI-only job: ' + str(error.code))
              print('CLI-only follow-up job is inaccessible over HTTP (404).')
          else:
              raise SystemExit('The follow-up job must not be accessible over HTTP.')
          try:
              urllib.request.urlopen('https://www.imporlan.cl/api/payment_receipts_api.php?action=list&request_id=release-check', timeout=20)
          except urllib.error.HTTPError as error:
              if error.code != 401:
                  raise SystemExit('Receipt API must require a verified session: ' + str(error.code))
              print('Payment receipt API requires authentication (401).')
          else:
              raise SystemExit('Payment evidence must not be accessible without authentication.')
          PY
