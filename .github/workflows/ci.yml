name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      
      - name: Check PHP syntax
        run: |
          echo "Checking PHP syntax..."
          find . -name "*.php" -not -path "./vendor/*" | while read file; do
            php -l "$file" || exit 1
          done
          echo "PHP syntax check passed!"

      - name: Tests del contestador de WhatsApp
        run: php test/whatsapp-rehacer-tests.php

      - name: La planilla de la cotización no sale al cliente
        run: php test/cotizador-cliente-tests.php

      - name: Desglose del All-Inclusive (sin el FEE)
        run: php test/cotizador-desglose-tests.php

      - name: Tests de recuperacion de contrasena de clientes
        run: php test/recuperacion-clientes-tests.php

      - name: El panel del cliente habla bien
        run: php test/panel-cliente-idioma-tests.php

      - name: Cambiar la contrasena cierra las sesiones en TODO el sitio
        run: php test/sesiones-tests.php

      - name: Nadie lee un token sin verificar la firma (JWT y login con Google)
        run: php test/jwt-firma-tests.php

      - name: Nada sale antes de las cabeceras (401 y redirecciones de pago)
        run: php test/salida-limpia-tests.php

      - name: Ninguna ruta de cliente lee datos de otro cliente (sesion obligatoria)
        run: php test/acceso-api-tests.php

      - name: Datos para transferir son los de Global66 (no Santander)
        run: php test/datos-bancarios-tests.php

      - name: Elegir la lancha e importar (reglas, acciones y correos)
        run: php test/eleccion-lancha-tests.php

      - name: Inspección realizada (carga completa y seguimiento diario AM)
        run: php test/inspection-upload-tests.php

  javascript-lint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install ESLint
        run: npm install eslint@8 --save-dev
      
      - name: Run ESLint
        run: npx eslint assets/*.js test/assets/*.js --config .eslintrc.json || true

  html-validation:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install html-validate
        # Keep the validator independent of the app's dependency tree. npm 10
        # currently crashes in Arborist (edgesOut) when adding it at the root.
        run: npm install --prefix "$RUNNER_TEMP/imporlan-html-validation" --no-package-lock --no-audit --no-fund html-validate@9
      
      - name: Validate HTML files
        run: |
          validation_bin="$RUNNER_TEMP/imporlan-html-validation/node_modules/.bin/html-validate"
          "$validation_bin" index.html --config .htmlvalidate.json || true
          "$validation_bin" test/index.html --config .htmlvalidate.json || true
          "$validation_bin" panel/index.html --config .htmlvalidate.json || true
          "$validation_bin" admin/index.html --config .htmlvalidate.json || true

  css-lint:
    name: CSS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Stylelint
        run: npm install stylelint stylelint-config-standard --save-dev
      
      - name: Run Stylelint
        run: npx stylelint "assets/*.css" "test/assets/*.css" --config .stylelintrc.json || true
