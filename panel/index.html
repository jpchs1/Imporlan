<!doctype html>
<html lang="es">
  <head>
    <script src="/panel/assets/tracking-bridge.js?v=795fc893"></script>

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/imporlan-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Imporlan · Mi panel</title>
    <style>
      #app-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #0b1220;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        transition: opacity 0.3s ease;
      }
      #app-loader.fade-out { opacity: 0; pointer-events: none; }
      #app-loader img { width: 150px; height: auto; }
      #app-loader .loader-bar { width: 140px; height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
      #app-loader .loader-bar-fill { width: 40%; height: 100%; background: #0891b2; border-radius: 2px; animation: loaderSlide 1.1s ease-in-out infinite; }
      @keyframes loaderSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
      @media (prefers-reduced-motion: reduce) { #app-loader .loader-bar-fill { animation: none; width: 100%; } }
    </style>
    <script type="module" crossorigin src="/panel/assets/index-DOprs_Pq.js"></script>
    <link rel="modulepreload" crossorigin href="/panel/assets/utils-CSOhpnlW.js">
    <link rel="modulepreload" crossorigin href="/panel/assets/UI-BcdU9gfF.js">
    <link rel="modulepreload" crossorigin href="/panel/assets/Toast-CRDQYNx_.js">
    <link rel="modulepreload" crossorigin href="/panel/assets/api-DUdqZyNY.js">
    <link rel="modulepreload" crossorigin href="/panel/assets/AuthContext-CR7a9I_0.js">
    <link rel="modulepreload" crossorigin href="/panel/assets/lib-B2bB-PIe.js">
    <link rel="modulepreload" crossorigin href="/panel/assets/whatsapp-BU7ZzYmH.js">
    <link rel="stylesheet" crossorigin href="/panel/assets/index-DU69gh3D.css">
  </head>
  <body>
    <div id="app-loader" role="status" aria-label="Cargando">
      <img src="/panel/imporlan-logo.svg" alt="Imporlan" onerror="this.style.display='none'" />
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>
      // Oculta el loader cuando React monta.
      const observer = new MutationObserver(() => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          const loader = document.getElementById('app-loader');
          if (loader) { loader.classList.add('fade-out'); setTimeout(() => loader.remove(), 400); }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
      // Respaldo: ocultar a los 5 s
      setTimeout(() => { const l = document.getElementById('app-loader'); if (l) { l.classList.add('fade-out'); setTimeout(() => l.remove(), 400); } }, 5000);
    </script>
  </body>
</html>
